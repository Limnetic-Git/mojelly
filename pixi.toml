# pixi.toml
[workspace]
name = "mojelly"
preview = ["pixi-build"]
channels = [
    "https://conda.modular.com/max-nightly",
    "https://repo.prefix.dev/modular-community",
    "conda-forge",
]
platforms = ["linux-64"]
version = "0.6.0"

[dependencies]
mojo = "==1.2.0"
emberjson = { git = "https://github.com/bgreni/EmberJson.git", tag = "0.5.0" }

[tasks]
build = "bash build.sh"
run = "./server"
test = "bash run_tests.sh"
lint = "bash lint.sh"
fmt = "mojo format mojelly examples tests generator.mojo"
